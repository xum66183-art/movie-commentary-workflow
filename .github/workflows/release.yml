name: Manual release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching the source version
        required: true
        type: string
        default: v0.3.0
      source_ref:
        description: Source commit or ref that is an ancestor of current main
        required: true
        type: string
        default: main

permissions: {}

concurrency:
  group: manual-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_REF: ${{ inputs.source_ref }}
    steps:
      - name: Check out the workflow commit and release notes
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: tools
          persist-credentials: false

      - name: Validate inputs and resolve the source commit
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Run this manual workflow from main." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag; expected vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          candidate="$SOURCE_REF"
          if [[ "$candidate" == refs/heads/* ]]; then
            candidate="refs/remotes/origin/${candidate#refs/heads/}"
          elif git -C tools show-ref --verify --quiet "refs/remotes/origin/$candidate"; then
            candidate="refs/remotes/origin/$candidate"
          fi
          resolved=$(git -C tools rev-parse --verify --end-of-options "${candidate}^{commit}")
          if [[ ! "$resolved" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Source ref did not resolve to a single commit." >&2
            exit 1
          fi
          git -C tools merge-base --is-ancestor "$resolved" refs/remotes/origin/main
          notes="$GITHUB_WORKSPACE/tools/.github/release-notes/$RELEASE_TAG.md"
          if [[ ! -s "$notes" ]]; then
            echo "Release notes are missing from the workflow commit." >&2
            exit 1
          fi
          printf 'sha=%s\n' "$resolved" >> "$GITHUB_OUTPUT"
          printf 'notes=%s\n' "$notes" >> "$GITHUB_OUTPUT"

      - name: Check out the validated source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          path: source
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source/pyproject.toml

      - name: Confirm the source version
        working-directory: source
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          version = project["project"]["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit("Release tag does not match pyproject.toml version.")
          PY

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install source dependencies
        working-directory: source
        run: python -m pip install -e '.[index,dev]'

      - name: Verify the source and existing tests
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_repository.py
          python scripts/validate_skills.py
          python scripts/validate_project.py examples/synthetic-demo
          python -m pytest
          python -m ruff check .

      - name: Generate the public offline demo
        working-directory: source
        run: python scripts/run_demo.py --output "$RUNNER_TEMP/offline-demo"

      - name: Build the source archive
        working-directory: source
        run: python -m build --sdist --outdir "$RUNNER_TEMP/source-dist"

      - name: Assemble public release assets
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os
          import pathlib
          import shutil
          import zipfile

          temporary = pathlib.Path(os.environ["RUNNER_TEMP"])
          public = temporary / "offline-demo" / "release"
          assets = temporary / "release-assets"
          assets.mkdir()
          files = sorted(public.iterdir())
          if not files or any(not path.is_file() or path.is_symlink() for path in files):
              raise SystemExit("The public demo must contain regular files only.")
          demo_name = f"movie-commentary-workflow-{os.environ['RELEASE_TAG']}-demo.zip"
          with zipfile.ZipFile(assets / demo_name, "w", zipfile.ZIP_DEFLATED) as archive:
              for path in files:
                  archive.write(path, arcname=f"release/{path.name}")
          for name in ("demo.mp4", "preview.png"):
              shutil.copyfile(public / name, assets / name)
          distributions = list((temporary / "source-dist").glob("*.tar.gz"))
          if len(distributions) != 1:
              raise SystemExit("Expected exactly one source distribution.")
          source_name = distributions[0].name
          shutil.copyfile(distributions[0], assets / source_name)
          checksums = []
          for path in sorted(assets.iterdir()):
              with path.open("rb") as stream:
                  checksum = hashlib.file_digest(stream, "sha256").hexdigest()
              checksums.append(f"{checksum}  {path.name}\n")
          (assets / "SHA256SUMS").write_text("".join(checksums), encoding="utf-8")
          expected = {demo_name, "demo.mp4", "preview.png", source_name, "SHA256SUMS"}
          if {path.name for path in assets.iterdir()} != expected:
              raise SystemExit("Release assets differ from the five expected public files.")
          PY

      - name: Retain public assets for inspection
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ inputs.tag }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error

      - name: Check existing release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          RESOLVED_SHA: ${{ steps.resolve.outputs.sha }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          api = os.environ["GITHUB_API_URL"]
          repository = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]

          def get(path):
              request = urllib.request.Request(
                  f"{api}/repos/{repository}/{path}",
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return None
                  raise

          if get(f"releases/tags/{tag}") is not None:
              raise SystemExit("Release already exists; refusing to overwrite it.")
          reference = get(f"git/ref/tags/{tag}")
          if reference is not None:
              target = reference["object"]
              for _ in range(20):
                  if target["type"] != "tag":
                      break
                  annotated = get(f"git/tags/{target['sha']}")
                  if annotated is None:
                      raise SystemExit("Existing annotated tag could not be resolved.")
                  target = annotated["object"]
              if target["type"] != "commit" or target["sha"] != os.environ["RESOLVED_SHA"]:
                  raise SystemExit("Existing tag does not point to the validated source commit.")
          PY

      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RESOLVED_SHA: ${{ steps.resolve.outputs.sha }}
          NOTES_FILE: ${{ steps.resolve.outputs.notes }}
        shell: bash
        run: |
          set -euo pipefail
          assets=("$RUNNER_TEMP/release-assets/"*)
          if [[ ${#assets[@]} -ne 5 ]]; then
            echo "Expected exactly five release assets." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RESOLVED_SHA" \
            --notes-file "$NOTES_FILE" \
            --title "$RELEASE_TAG — Reproducible offline demo and source release" \
            "${assets[@]}"
