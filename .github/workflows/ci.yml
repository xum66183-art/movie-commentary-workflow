name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install
        run: python -m pip install -e '.[index,dev]'
      - name: Public repository safety
        run: python scripts/check_repository.py
      - name: Skill structure
        run: python scripts/validate_skills.py
      - name: Example project state
        run: python scripts/validate_project.py examples/synthetic-demo
      - name: Tests
        run: python -m pytest
      - name: Lint
        run: python -m ruff check .
      - name: Offline public demo
        run: python scripts/run_demo.py --output "$RUNNER_TEMP/offline-demo"
      - uses: actions/upload-artifact@v4
        with:
          name: offline-demo-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/offline-demo/release/*
          if-no-files-found: error
      - name: Build source release
        run: python -m build --sdist --outdir "$RUNNER_TEMP/workflow-dist"
      - uses: actions/upload-artifact@v4
        with:
          name: source-release-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/workflow-dist/*.tar.gz
          if-no-files-found: error
