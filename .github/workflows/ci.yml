name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install
        run: python -m pip install -e '.[index,dev]'
      - name: Public repository safety
        run: python scripts/check_repository.py
      - name: Skill structure
        run: python scripts/validate_skills.py
      - name: Example project state
        run: python scripts/validate_project.py examples/synthetic-demo
      - name: Tests
        run: python -m pytest
      - name: Lint
        run: python -m ruff check .
