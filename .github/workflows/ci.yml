name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Linux media tools and test font
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install macOS media tools
        if: runner.os == 'macOS'
        run: command -v ffmpeg || brew install ffmpeg
      - name: Install
        run: python -m pip install -e '.[index,dev]'
      - name: Public repository safety
        run: python scripts/check_repository.py
      - name: Skill structure
        run: python scripts/validate_skills.py
      - name: Example project state
        run: python scripts/validate_project.py examples/synthetic-demo
      - name: Tests including synthetic rendering
        run: python -m pytest
      - name: Compile Python
        run: python -m compileall -q movie_workflow scripts .codex/skills
      - name: Lint
        run: python -m ruff check .
      - name: Build wheel
        run: python -m pip wheel --no-deps --no-build-isolation -w "$RUNNER_TEMP/wheels" .
      - name: Apple Vision and MIDI smoke checks
        if: runner.os == 'macOS'
        run: python scripts/macos/smoke_test.py --output "$RUNNER_TEMP/movie-native-smoke"
      - name: Offline public demo
        run: python scripts/run_demo.py --output "$RUNNER_TEMP/offline-demo"
      - uses: actions/upload-artifact@v4
        with:
          name: offline-demo-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/offline-demo/release/*
          if-no-files-found: error
      - name: Build source release
        run: python -m build --sdist --outdir "$RUNNER_TEMP/workflow-dist"
      - uses: actions/upload-artifact@v4
        with:
          name: source-release-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/workflow-dist/*.tar.gz
          if-no-files-found: error
