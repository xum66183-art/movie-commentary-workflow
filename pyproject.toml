[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "movie-commentary-workflow"
version = "0.2.0"
description = "Auditable Codex skills and data contracts for first-person movie commentary production"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "jsonschema>=4.23,<5",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
index = [
  "Pillow>=10,<13",
  "scenedetect>=0.6.7,<0.7",
  "opencv-python-headless>=4.10,<5",
]
tts = ["fish-audio-sdk==1.3.0"]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
